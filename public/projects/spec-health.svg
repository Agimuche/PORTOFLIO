<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#080e1a"/>
  
  <circle cx="280" cy="180" r="220" fill="#0284c7" fill-opacity="0.18" filter="blur(70px)"/>
  <circle cx="580" cy="320" r="240" fill="#0369a1" fill-opacity="0.18" filter="blur(70px)"/>

  <!-- Telemedicine & Medical Pulse Architecture Graphic -->
  <g transform="translate(420, 160)">
    <!-- Medical Cross Shield -->
    <path d="M 0 -30 L 70 5 L 70 90 Q 0 160 -70 90 L -70 5 Z" fill="#0c2340" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Medical Cross -->
    <rect x="-10" y="20" width="20" height="60" rx="3" fill="#38bdf8"/>
    <rect x="-30" y="40" width="60" height="20" rx="3" fill="#38bdf8"/>

    <!-- Pulse ECG Line across -->
    <path d="M -160 120 L -80 120 L -60 90 L -40 150 L -20 100 L 0 120 L 160 120" stroke="#0ea5e9" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Overlay UI Label -->
  <rect x="50" y="340" width="310" height="110" rx="16" fill="#0c2340" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
  <text x="75" y="375" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2">TELEMEDICINE PLATFORM</text>
  <text x="75" y="405" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">SPEC Health System</text>
  <text x="75" y="428" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12">FastAPI · React · PostgreSQL · Doctor Queue</text>

  <rect x="630" y="45" width="120" height="32" rx="16" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
  <text x="645" y="66" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Health Cloud</text>
</svg>
