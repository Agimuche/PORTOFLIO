<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#08101e"/>
  
  <circle cx="280" cy="180" r="220" fill="#0284c7" fill-opacity="0.2" filter="blur(70px)"/>
  <circle cx="580" cy="320" r="240" fill="#38bdf8" fill-opacity="0.15" filter="blur(70px)"/>

  <!-- Weather Radar & Isobars Graphic -->
  <g transform="translate(420, 160)">
    <!-- Cloud & Sun Elements -->
    <circle cx="40" cy="40" r="30" fill="#f59e0b"/>
    <!-- Glowing rays -->
    <line x1="40" y1="-5" x2="40" y2="5" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="85" y1="40" x2="75" y2="40" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="72" y1="8" x2="65" y2="15" stroke="#f59e0b" stroke-width="2.5"/>

    <path d="M -70 110 C -70 80 -40 80 -30 80 C -20 50 20 50 30 70 C 50 70 60 90 60 110 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <!-- Rain droplets -->
    <line x1="-30" y1="125" x2="-35" y2="145" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-5" y1="125" x2="-10" y2="145" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="125" x2="15" y2="145" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="45" y1="125" x2="40" y2="145" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Overlay UI Label -->
  <rect x="50" y="340" width="310" height="110" rx="16" fill="#0c4a6e" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
  <text x="75" y="375" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2">WEATHER RADAR</text>
  <text x="75" y="405" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">SkyCast Weather App</text>
  <text x="75" y="428" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12">React · OpenWeather API · Dynamic Themes</text>

  <rect x="630" y="45" width="120" height="32" rx="16" fill="#075985" stroke="#38bdf8" stroke-width="1"/>
  <text x="645" y="66" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Open Source</text>
</svg>
